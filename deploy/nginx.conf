server {
    listen 80;
    server_name localhost;

    # 增加上传文件大小限制
    client_max_body_size 512M;

    # 压缩前端静态资源，降低公网首次加载体积。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/otf
        font/ttf
        font/woff
        font/woff2
        application/font-sfnt;

    # 前端构建时 base=/robot-dog-web/，根路径访问时跳转到应用入口。
    location = / {
        return 301 /robot-dog-web/;
    }

    location = /robot-dog-web {
        return 301 /robot-dog-web/;
    }

    # 前端静态文件
    location /robot-dog-web/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /robot-dog-web/index.html;
    }

    # SSE Endpoint - Specific configuration
    location /api/events {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    # 后端 API 代理
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        # 安全策略：默认剥离 hop-by-hop 头，避免上游误处理/转发造成异常
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Proxy-Connection "";
        proxy_set_header TE "";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 地图文件代理
    location /maps {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 图片文件代理
    location /images {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 动物物种识别结果图片代理
    location /animal-species {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
